<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Quality Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 id="title">Default quality</h1>
    <p>Used for every YouTube video, unless you remembered a different one for that video.</p>
  </header>
  <div id="options" class="options" role="radiogroup" aria-labelledby="title"></div>
  <div class="memory">
    <span id="memory-count">No videos remembered</span>
    <button type="button" id="forget-all" class="link" hidden>Forget all</button>
  </div>
  <p class="hint">In the player, the quality button (next to the gear) changes only the current video. To save it, use "Remember for this video" or "Make default" at the bottom of that menu.</p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
