<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Quality Control</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 id="title">Video quality</h1>
    <p>Applied to every YouTube video automatically.</p>
  </header>
  <div id="options" class="options" role="radiogroup" aria-labelledby="title"></div>
  <p class="hint">You can also change this from the quality button in the YouTube player, next to the settings (gear) button.</p>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
